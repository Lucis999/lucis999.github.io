<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucis — An Atlas of Experience</title><link rel="stylesheet" href="preview-fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#050d1c;color:#eaf0fa;font:14px/1.7 Inter,Arial,sans-serif;overflow-x:hidden}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit}#universe{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 75% 45%,#102c48 0, #091626 35%,#050b18 75%)}canvas{position:absolute;width:100%;height:100%;inset:0}#stars{opacity:.7}#map{opacity:1}.aurora{position:fixed;inset:-25%;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1s;filter:blur(50px);background:radial-gradient(ellipse 45% 12% at 60% 20%,#4af3bf45,transparent 80%),radial-gradient(ellipse 50% 10% at 80% 30%,#7268ff50,transparent 85%);transform:rotate(-20deg);animation:aurora 16s ease-in-out infinite alternate}body.aurora-on .aurora{opacity:1}@keyframes aurora{to{transform:rotate(-10deg) translate(-4%,10%) scale(1.15)}}header{display:flex;align-items:center;justify-content:space-between;padding:24px 5vw;border-bottom:1px solid #ffffff15;background:#06101c66;backdrop-filter:blur(14px)}.brand{font-weight:600;font-size:19px;letter-spacing:-.8px;text-decoration:none}.brand span{color:#85d9ca}nav{display:flex;gap:8px}nav button{border:0;background:none;color:#93a8bf;padding:8px 15px;border-radius:30px}nav button.active{color:white;background:#ffffff10}.preview-label{font:10px Inter;letter-spacing:2px;color:#91a7b7}main{max-width:1440px;margin:auto;padding:65px 7vw 45px;min-height:calc(100vh - 94px)}.eyebrow{font-size:10px;color:#7fbbca;letter-spacing:3px;text-transform:uppercase;margin-bottom:25px}h1{font:500 clamp(50px,6vw,88px)/1.08 'Space Grotesk',sans-serif;letter-spacing:-4px;margin:0 0 25px}h1 em{font:italic 500 1.08em 'Cormorant Garamond',serif;color:#95decf}p{color:#a6b8cc}.home-copy{max-width:480px}.home-copy p{max-width:400px;font-size:15px;line-height:1.9}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.actions button{border-radius:30px;border:1px solid #8ddac766;padding:12px 22px;background:#a2e7d3;color:#092523;font-size:12px}.actions button.secondary{background:#0d233a88;color:#d4e2ed;border-color:#ffffff25}.hero-location{position:absolute;right:7vw;bottom:135px;color:#8cabc5;font:10px monospace;letter-spacing:2px}.orbit-label{color:#72b9cb;font:10px monospace;letter-spacing:2px;margin-top:70px}.controls{position:fixed;bottom:20px;left:5vw;right:5vw;display:flex;justify-content:space-between;gap:12px;z-index:10;align-items:center}.control-set{display:flex;gap:6px;padding:5px;border:1px solid #ffffff18;background:#091728dc;border-radius:25px;backdrop-filter:blur(20px)}.control-set button{background:none;border:0;color:#a8bed2;font-size:11px;padding:8px 13px;border-radius:20px}.control-set button[aria-pressed=true]{background:#d1e8e3;color:#092127}.controls a{font-size:11px;color:#95adbf;text-decoration:none}.panel{transition:opacity .35s,transform .35s;max-width:550px}.panel.fading{opacity:0;transform:translateY(12px)}.content-title{font-size:58px}.content-lead{max-width:440px;font-size:14px}.record{padding:19px 23px;margin-top:13px;background:linear-gradient(100deg,#0b1c30ed,#10283cbb);border:1px solid #ffffff16;border-radius:9px;backdrop-filter:blur(18px)}.record small{font-size:10px;color:#86bdc9;letter-spacing:1px}.record h2{font:500 19px 'Space Grotesk';margin:7px 0}.record p{font-size:12px;margin:3px 0}.record a{text-decoration:none}.record a:hover{color:#9edaca}.scene-caption{position:fixed;right:5vw;top:125px;font:10px monospace;letter-spacing:2px;color:#86b3c8;text-align:right;pointer-events:none}.scene-caption b{display:block;font:500 23px 'Space Grotesk';letter-spacing:-.5px;margin-top:10px;color:#d5eee9}.journey-progress{position:fixed;left:0;right:0;bottom:0;height:2px;background:#77dbbd;transform:scaleX(0);transform-origin:left;z-index:20}.credits{font-size:9px;color:#72899e;margin-top:24px}.loading{position:fixed;bottom:85px;right:5vw;font:11px monospace;color:#84d9c0}.failure{background:#18344b;padding:15px;border-radius:5px}button:focus-visible,a:focus-visible{outline:2px solid #b5fce4;outline-offset:4px}@media(max-width:800px){header{padding:18px 5vw;flex-wrap:wrap;gap:14px}.preview-label{display:none}nav{gap:0}nav button{font-size:11px;padding:7px 10px}.brand{font-size:17px}main{padding:45px 6vw 120px}.home-copy{max-width:340px}h1{font-size:56px;letter-spacing:-3px}.home-copy p{font-size:13px;max-width:270px}.panel{max-width:100%}.record{background:#0a1c30e8}.scene-caption{top:115px;right:6vw;font-size:8px}.scene-caption b{font-size:17px}.hero-location{display:none}.controls{left:4vw;right:4vw;bottom:16px}.controls>a{display:none}.control-set button{font-size:10px;padding:7px 10px}.orbit-label{margin-top:40px}.content-title{font-size:48px}.eyebrow{margin-top:20px}.content-lead{max-width:80%;font-size:12px}.credits{margin-bottom:15px}}@media(prefers-reduced-motion:reduce){.aurora{animation:none}.panel{transition:none}}
</style></head><body><div id="universe"><canvas id="stars" aria-hidden="true"></canvas><canvas id="map" aria-hidden="true"></canvas></div><div class="aurora" aria-hidden="true"></div><header><a href="index.html" class="brand">Lucis Portfolio<span>.</span></a><nav aria-label="Journey preview"><button data-scene="home" class="active">Home</button><button data-scene="education">Education</button><button data-scene="experience">Experience</button></nav><span class="preview-label">A GEOGRAPHIC JOURNEY · CONCEPT PREVIEW</span></header><main><div id="panel" class="panel"></div></main><div id="caption" class="scene-caption" aria-live="polite"></div><div class="controls"><div class="control-set" aria-label="Background style"><button id="starMode" aria-pressed="true">Starfield</button><button id="auroraMode" aria-pressed="false">Stars + Aurora</button></div><div class="control-set"><button id="motion" aria-pressed="false">Pause motion</button><button id="replay">Replay journey ↗</button></div><a href="index.html">← Original portfolio</a></div><div class="journey-progress" id="progress"></div><div class="loading" id="loading">Preparing the atlas…</div><script src="geo/d3.min.js"></script><script>
const map=document.querySelector('#map'),ctx=map.getContext('2d'),stars=document.querySelector('#stars'),st=stars.getContext('2d'),panel=document.querySelector('#panel'),caption=document.querySelector('#caption'),progress=document.querySelector('#progress');let W,H,D,countries,provinces,scene='home',moving=false,paused=false,current={rotate:[105,-22,0],scale:1,mode:'globe'},transition=null,startTime=performance.now();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;paused=reduced;const points=Array.from({length:150},(_,i)=>({x:((Math.sin(i*127.1)*43758.5453)%1+1)%1,y:((Math.sin(i*311.7)*17289.123)%1+1)%1,r:i%5===0?1.3:.65,phase:i*.7}));
const views={home:`<div class="home-copy"><div class="eyebrow">Lucis’s Portfolio</div><h1>A world of<br><em>connections.</em></h1><p>Projects, experiences and the places that connect them. Explore the journey from a global perspective to the places where I’ve learned and worked.</p><div class="actions"><button data-go="education">Explore Education ↗</button><button class="secondary" data-go="experience">Explore Experience ↗</button></div><div class="orbit-label">EXPLORE THE GLOBE → CANADA → BRITISH COLUMBIA</div></div><div class="hero-location">49.28° N / 123.12° W<br>VANCOUVER · BRITISH COLUMBIA</div>`,education:`<div class="eyebrow">Canada / British Columbia</div><h1 class="content-title">Education</h1><p class="content-lead">Three academic chapters, connected by the west coast of Canada.</p><article class="record"><small>2026 — PRESENT · VANCOUVER</small><h2><a href="https://www.ubc.ca/" target="_blank" rel="noopener">University of British Columbia ↗</a></h2><p>Master of Business Analytics · UBC Sauder School of Business</p></article><article class="record"><small>2021 — 2023 · VANCOUVER</small><h2><a href="https://www.nyit.edu/" target="_blank" rel="noopener">New York Institute of Technology ↗</a></h2><p>Master of Science in Cybersecurity</p></article><article class="record"><small>2017 — 2021 · VICTORIA</small><h2><a href="https://www.uvic.ca/" target="_blank" rel="noopener">University of Victoria ↗</a></h2><p>Combined Major in Statistics & Mathematics · Minor in Business</p></article><p class="credits">Map outlines: Natural Earth · Province boundaries: Click That ’Hood / Canada.</p>`,experience:`<div class="eyebrow">North America / Experience</div><h1 class="content-title">Experience</h1><p class="content-lead">A continental view, with my experience grounded in British Columbia.</p><article class="record"><small>JAN — MAR 2024 · BURNABY</small><h2>BC Housing</h2><p>Quality Assistant · Data validation, subsidy reviews and user acceptance testing.</p></article><article class="record"><small>JAN — MAY 2023 · VANCOUVER</small><h2>New York Institute of Technology</h2><p>Algorithms Teaching Assistant</p></article><article class="record"><small>2023 · GRADUATE CAPSTONE</small><h2>PAQT</h2><p>Digital signing workflow · NYIT industry collaboration</p></article><p class="credits">Geographic context only; the map does not imply work across North America.</p>`};
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);for(const c of [map,stars]){c.width=W*D;c.height=H*D;c.getContext('2d').setTransform(D,0,0,D,0,0)}}addEventListener('resize',resize);resize();function globeProjection(t){return d3.geoOrthographic().rotate([105+(paused?0:Math.sin(t*.000035)*9),-22,0]).translate([W*(W<800?.78:.76),H*.49]).scale(Math.min(W*.30,H*.36)).clipAngle(90)}
const canadaNames=['Canada'];function path(feature,projection,fill,stroke,width=.7){ctx.beginPath();d3.geoPath(projection,ctx)(feature);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function mapProjection(target){const educ=target==='education';return d3.geoConicConformal().parallels([49,77]).rotate([educ?109:102,0]).center([0,educ?58:47]).translate([W*(W<800?.80:.76),H*(educ?.50:.53)]).scale(Math.min(W,H)*(educ?1.13:.66))}
function drawGlobe(t,opacity=1,zoom=1){ctx.save();ctx.globalAlpha=opacity;const proj=globeProjection(t).scale(Math.min(W*.30,H*.36)*zoom);const center=proj.translate(),r=proj.scale();const halo=ctx.createRadialGradient(...center,r*.8,...center,r*1.16);halo.addColorStop(0,'#4c9cbf00');halo.addColorStop(.83,'#73d5e42a');halo.addColorStop(1,'#73d5e400');ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);path({type:'Sphere'},proj,'#0b2337','#64b7c34f',1);path(d3.geoGraticule10(),proj,'#00000000','#73adbe18',.6);for(const f of countries.features){const ca=f.properties.name==='Canada';path(f,proj,ca?'#7cdbc28c':'#39607572',ca?'#a5f7df99':'#78a4b14d',.65)}ctx.restore()}
function drawMap(target,opacity,zoom=1){ctx.save();ctx.globalAlpha=opacity;const proj=mapProjection(target);proj.scale(proj.scale()*zoom);for(const f of countries.features){const n=f.properties.name;path(f,proj,n==='Canada'?'#1b465cbb':'#18304799',n==='Canada'?'#95d5d08c':'#7496ac4d',.8)}if(target==='education'){for(const f of provinces.features){const bc=f.properties.name==='British Columbia';path(f,proj,bc?'#60d1ad80':'#19425366',bc?'#c5ffe9cc':'#80b7bd40',bc?1.5:.7)}label(proj,[-99,66],'C A N A D A','#94bfd0',16);label(proj,[-126,56],'BRITISH COLUMBIA','#b5f5df',10);pin(proj,[-123.1207,49.2827],'Vancouver',0);pin(proj,[-123.3656,48.4284],'Victoria',1)}else{label(proj,[-110,62],'C A N A D A','#9bc4d5',14);label(proj,[-102,37],'U N I T E D  S T A T E S','#7898ac',11);label(proj,[-102,23],'M E X I C O','#7898ac',10);pin(proj,[-123.12,49.28],'Vancouver / Burnaby',0)}ctx.restore()}
function label(proj,coord,text,color,size){const q=proj(coord);ctx.font=`${size}px Inter,Arial`;ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(text,...q)}function pin(proj,coord,text,n){const q=proj(coord);ctx.beginPath();ctx.arc(q[0],q[1],4,0,Math.PI*2);ctx.fillStyle='#b9ffe4';ctx.fill();ctx.beginPath();ctx.arc(q[0],q[1],9,0,Math.PI*2);ctx.strokeStyle='#a8f9dc66';ctx.stroke();const dx=25,dy=n?28:-18;ctx.beginPath();ctx.moveTo(...q);ctx.lineTo(q[0]+dx,q[1]+dy);ctx.strokeStyle='#a8f9dc99';ctx.stroke();ctx.textAlign='left';ctx.font='11px Inter,Arial';ctx.fillText(text,q[0]+dx+5,q[1]+dy+4)}
function showContent(name){panel.innerHTML=views[name];panel.classList.remove('fading');document.querySelectorAll('[data-scene]').forEach(x=>x.classList.toggle('active',x.dataset.scene===name));caption.innerHTML=name==='home'?'GLOBAL VIEW<b>Earth</b>':name==='education'?'CANADA → BRITISH COLUMBIA<b>West coast, connected.</b>':'CONTINENTAL VIEW<b>North America</b>';document.querySelector('#replay').disabled=name==='home'}
function go(name,replay=false){if(moving||(!replay&&name===scene))return;moving=true;panel.classList.add('fading');const from=scene;scene=name;if(reduced){transition=null;moving=false;showContent(name);return}transition={from,to:name,start:performance.now(),duration:name==='home'?1600:2700};caption.innerHTML=name==='education'?'JOURNEY IN PROGRESS<b>Earth → Canada → BC</b>':name==='experience'?'JOURNEY IN PROGRESS<b>Earth → North America</b>':'RETURNING TO ORBIT<b>Earth</b>';setTimeout(()=>{showContent(name);moving=false;transition=null;progress.style.transform='scaleX(0)'},transition.duration)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-scene]');if(b)go(b.dataset.go||b.dataset.scene)});document.querySelector('#replay').onclick=()=>go(scene,true);document.querySelector('#motion').onclick=e=>{paused=!paused;document.querySelector('.aurora').style.animationPlayState=paused?'paused':'running';e.target.textContent=paused?'Resume motion':'Pause motion';e.target.setAttribute('aria-pressed',String(paused))};for(const [id,on]of [['starMode',false],['auroraMode',true]])document.querySelector('#'+id).onclick=()=>{document.body.classList.toggle('aurora-on',on);document.querySelector('#starMode').setAttribute('aria-pressed',String(!on));document.querySelector('#auroraMode').setAttribute('aria-pressed',String(on))};
function frame(t){st.clearRect(0,0,W,H);for(const p of points){st.globalAlpha=paused?.5:.3+.45*(.5+.5*Math.sin(t*.00045+p.phase));st.fillStyle='#c5e6f8';st.beginPath();st.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);st.fill()}ctx.clearRect(0,0,W,H);if(countries){if(transition){let u=Math.min(1,(t-transition.start)/transition.duration),ease=d3.easeCubicInOut(u);progress.style.transform=`scaleX(${u})`;if(transition.to==='home'){drawMap(transition.from,1-ease,1);drawGlobe(t,ease,1+(1-ease)*.45)}else{if(transition.from!=='home'&&u<.23)drawMap(transition.from,1-u/.23,1);drawGlobe(t,1-Math.min(1,Math.max(0,(u-.30)/.35)),1+ease*.55);if(u>.30){let m=d3.easeCubicOut((u-.30)/.70);drawMap(transition.to,Math.min(1,(u-.30)/.25),.63+.37*m)}}}else if(scene==='home')drawGlobe(t);else drawMap(scene,1)}requestAnimationFrame(frame)}showContent('home');requestAnimationFrame(frame);
Promise.all([fetch('geo/countries.json').then(r=>r.json()),fetch('geo/canada-provinces.json').then(r=>r.json())]).then(([c,p])=>{countries=c;provinces=p;document.querySelector('#loading').remove()}).catch(()=>{document.querySelector('#loading').textContent='Map unavailable. Please reload to try again.'});
</script></body></html>
