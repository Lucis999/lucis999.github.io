name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 1,13,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Refresh latest published EIA WTI spot price
        continue-on-error: true
        run: python3 scripts/refresh-oil-price.py
      - name: Generate project pages
        run: node scripts/update-projects.mjs
      - name: Validate site
        run: |
          node --test tests/websocket-security.test.mjs
          node scripts/check-site.mjs
          node scripts/check-project-transitions.mjs
          node scripts/check-project-shells.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
